<p class="usercomponent-text">КОМПОНЕНТ СПИСКА ЮЗЕРОВ</p>
<div class="users-container">
    <div *ngFor="let item of users" class="users-boxs">
        <p>{{$any(item).name}}</p>
        <p>{{$any(item).email}}</p>
        <p>{{$any(item).website}}</p>
        <p>{{$any(item).company.name}}</p>
        <button (click)="deleteUser(item.id)" class="delete">УДАЛИТЬ ЮЗЕРА</button>
     </div>
</div>
