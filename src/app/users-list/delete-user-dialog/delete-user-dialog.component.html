<div class="confirmDelete">
  <p class="head-text">ВЫ ТОЧНО ХОТИТЕ УДАЛИТЬ ПОЛЬЗОВАТЕЛЯ?</p>
  <div class="buttons">
    <button (click)="confirmDelete()" class="button_1">ДА
    <mat-icon>check</mat-icon>
    </button>
    <button (click)="cancel()" class="button_2">НЕТ
    <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
