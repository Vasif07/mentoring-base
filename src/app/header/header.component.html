
<div class="header"> 
    <div class="header-left">
      <div class="header-logo">
        <img src="/assets/Logo.svg" alt="логотип сайта">
      </div>
      <nav class="header-nav">
        <a class="header-nav-item" routerLink="users">{{headerItem1}}</a>
        <a class="header-nav-item" routerLink="/">{{aboutCompany}}</a>
        <a class="header-nav-item" *ngIf="isShowCatalog">{{headerItem3}}</a>
      </nav>
      <button (click)="isShowCatalog = !isShowCatalog">Скрыть/Показать каталог</button>
      <button (click)="changeMenuText()">Изменить текст</button>
    </div>
  
    <div class="header2">
      <div class="header-right">
        <nav class="header-nav2">
          <a href="tel:+79650842929" class="phone-logo">
            <img src="/assets/Phone.svg" alt="Телефон">
          </a>
          <a href="tel:+79650842929" class="phone-link">{{ phone | editphonenumber }}</a>
          <a href="/favorites" class="header-nav-item2">
            <img src="/assets/Heart.svg" alt="Избранное">
          </a>
          <a href="/shoppingcart" class="header-nav-item2">
            <img src="/assets/Basket.svg" alt="Корзина">
          </a>
        </nav>
      </div>
    </div>
  </div> 
  
  <div class="test_header">
    <div class="header-left_test">
      <div class="header-logo_test">
        <img src="/assets/catalog.svg" alt="Прочее">
      </div>
      <nav class="header-nav_test">
        <div *ngFor="let item of menuItems" class="header-nav-item_test">{{item}}</div>
      </nav>
    </div>
  <div> 
    <nav class="header-nav-search_map">
      <div class="search">
        <input type="text" placeholder="Поиск, например Круг зачистной">
        <img src="/assets/search.svg" alt="поиск" class="icon">
      </div>
      <div class="header-nav-item_location">
        <img src="/assets/Location.svg" alt="Карта">
        <span>Москва</span>
      </div>
    </nav>
  </div>
  </div>

  <div>
      <p>{{ someDate | date:'medium' }}</p>
  </div>
